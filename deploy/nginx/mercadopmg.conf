# /etc/nginx/sites-available/mercadopmg
# Certbot agrega el bloque HTTPS (443) y la redirección al ejecutar:
#   sudo certbot --nginx -d mercados.gpe.gob.mx

server {
    listen 80;
    listen [::]:80;
    server_name mercados.gpe.gob.mx;

    root /var/www/mercadopmg/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/mercadopmg.access.log;
    error_log  /var/log/nginx/mercadopmg.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Recursos compilados por Vite: nombres con hash, se pueden cachear un año.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Ningún otro .php ni archivos ocultos (.env, .git) se sirven.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
