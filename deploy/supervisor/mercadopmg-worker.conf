; /etc/supervisor/conf.d/mercadopmg-worker.conf
[program:mercadopmg-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mercadopmg/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/mercadopmg/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
